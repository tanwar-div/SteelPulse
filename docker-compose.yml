services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: steelpulse
      POSTGRES_PASSWORD: steelpulse
      POSTGRES_DB: steelpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steelpulse -d steelpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      STEELPULSE_ENV: docker
      DATABASE_URL: postgresql+psycopg://steelpulse:steelpulse@postgres:5432/steelpulse
      REDIS_URL: redis://redis:6379/0
      WORKER_COUNT: ${WORKER_COUNT:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
