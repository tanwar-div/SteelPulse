[project]
name = "steelpulse"
version = "1.0.0"
description = "Industrial operations and supply chain automation platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...) in a default argument is the FastAPI dependency idiom.
# UP042: str-mixin enums keep SQLAlchemy's Enum column mapping straightforward.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"app/routers/*.py" = ["E501"]
